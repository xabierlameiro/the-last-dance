schema: spec-driven

context: |
  Personal blog xabierlameiro.com. Next.js 15.5 Pages Router, React 19, TypeScript 5.8,
  Jest + Playwright, npm (package-lock.json), deployed on Vercel (Hobby: small deploy budget).
  Posts are MDX under data/blog/<slug>/<slug>.<en|es|gl>.mdx. Conventional Commits.
  Earlier Spec-Driven work lives in specs/NNN-*.md (SDD 001-013) and specs/local/ (L01-L14,
  never committed). New growth work lives here as OpenSpec changes.
  Every number in a proposal must name its source and date (GSC API, GA4, Vercel logs).

# Per-artifact rules (optional)
