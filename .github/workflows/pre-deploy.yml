# The quality gate. Runs on every pull request to `master` and again after merge.
#
# SDD-L01: this workflow used to trigger on `push: [dev]`. `dev` went stale on 2025-07-23 (its last
# run failed) while every PR targeted `master`, so lint, typecheck, tests and `npm audit` were
# configured, working, and never consulted on the path to production. Now `code_checking` and
# `testing` gate the PR; the report-publishing and versioning jobs only run after merge, guarded on
# `github.event_name == 'push'`.
#
# The `deploy` job was removed rather than moved: it POSTed to a Vercel deploy hook to build a
# *preview* from `dev`. On `master`, vercel.json already has `deploymentEnabled.master = true`, so
# the git integration deploys every push — keeping the hook would have produced two deployments per
# merge.
name: Quality Gate
# `integration/next-16` is a long-lived branch that the Next 16 migration lands on in phases,
# without deploying: `vercel.json` only gives `master` a production deploy. Without it listed here
# no phase PR would run a gate at all, and the per-phase split — whose whole point is that a
# regression names the phase that caused it — would prove nothing until the final merge.
on:
    pull_request:
        branches: [master, integration/next-16]
    push:
        branches: [master]

# Native replacement for styfle/cancel-workflow-action, which was pinned by mutable tag and received
# secrets.TOKEN_GITHUB — a PAT with write access to five other repositories. `concurrency` needs no
# token and no third-party code, so the exposure is removed rather than pinned.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Least privilege by default. Only `version` writes back to this repo, and it raises its own.
permissions:
    contents: read

jobs:
    code_checking:
        name: Linting
        runs-on: ubuntu-22.04
        # No job here had a timeout, so a hung run held a runner for GitHub's 6-hour default.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - name: Install dependencies
              run: |
                  echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
                  echo "@xabierlameiro:registry=https://npm.pkg.github.com/" >> ~/.npmrc
                  npm ci --legacy-peer-deps --include=optional
            - name: Linter
              run: npm run lint
            - name: Type check
              run: npx tsc --noEmit
            # The feeds and llms files are generated at prebuild but also committed, because
            # scripts/indexnow-ping.ts and api/indexed-pages.ts read files from disk (#187). Nothing
            # forced a regeneration, so three posts went missing from the committed copies between
            # e0c2162 and 2026-10-01. Both generators are deterministic and read no environment.
            # The sitemap is left out: it is written during `next build` with NEXT_PUBLIC_DOMAIN,
            # which is localhost on Dependabot PRs.
            - name: Generated feeds and llms files match data/blog
              run: |
                  node scripts/generate-llms.ts > /dev/null
                  node scripts/generate-feeds.ts > /dev/null
                  if ! git diff --exit-code --stat -- public/feed.xml public/feed.es.xml public/feed.gl.xml public/llms.txt public/llms-full.txt; then
                      echo "::error::Stale generated files. Run: node scripts/generate-llms.ts && node scripts/generate-feeds.ts, then commit public/."
                      exit 1
                  fi
            # Wraps `npm audit --omit=dev` with a dated allowlist, because one advisory
            # (GHSA-mh99-v99m-4gvg) has no upstream fix and is unreachable here. A stale or expired
            # allowlist entry fails the gate, so the exception cannot rot. See scripts/audit-gate.mjs.
            - name: Security audit (production dependencies)
              run: npm run audit:prod
    testing:
        name: Testing
        runs-on: ubuntu-22.04
        # Unit tests, a production build, the e2e suite and 55 full-page captures. Generous, but
        # bounded: the point is that a hang fails rather than idles.
        timeout-minutes: 45
        env:
            # Pull requests opened by Dependabot get no repository secrets, so this was empty on every
            # one of them and the build failed prerendering /404 with `TypeError: Invalid URL` (#208,
            # #210). Without the secret, fall back to what a developer machine uses: the build is
            # served on localhost either way.
            NEXT_PUBLIC_DOMAIN: ${{ secrets.NEXT_PUBLIC_DOMAIN || 'http://localhost:3000' }}
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            NEXT_PUBLIC_ENV: 'preview'
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - name: Install dependencies
              run: |
                  echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
                  echo "@xabierlameiro:registry=https://npm.pkg.github.com/" >> ~/.npmrc
                  npm ci --legacy-peer-deps --include=optional
            # Coverage thresholds live in jest.config.js and fail this step when breached.
            - name: Run unit tests
              run: npm run coverage
            # Every other gate serves `next build`, which runs webpack, while `npm run dev` runs
            # Turbopack. #237 broke the dev server that way and nothing noticed: Turbopack refused
            # the @next/mdx loader options. /comments is the one page that loader compiles, and
            # `ch-codeblock` is the Code Hike block it renders. `setsid` puts the server in its own
            # process group so `kill` stops next as well as npm.
            - name: Dev server starts and serves pages
              run: |
                  setsid npm run dev -- --port 3100 > "$RUNNER_TEMP/next-dev.log" 2>&1 &
                  dev_pid=$!
                  failed=0
                  for route in /comments /blog/nextjs/dark-theme; do
                      status=$(curl -s -o "$RUNNER_TEMP/page.html" -w '%{http_code}' \
                          --retry 30 --retry-delay 2 --retry-connrefused --retry-max-time 120 --max-time 120 \
                          "http://localhost:3100$route") || status=000
                      echo "$route → $status"
                      [ "$status" = 200 ] || failed=1
                      if [ "$route" = /comments ] && ! grep -q 'ch-codeblock' "$RUNNER_TEMP/page.html"; then
                          echo "/comments has no Code Hike block"
                          failed=1
                      fi
                  done
                  kill -- -"$dev_pid" || true
                  # Backstop in case setsid forked and the group above was not next's.
                  pkill -f 'next dev --port 3100' || true
                  if [ "$failed" = 1 ]; then
                      cat "$RUNNER_TEMP/next-dev.log"
                      exit 1
                  fi
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps chromium chromium-headless-shell
              env:
                  DEBIAN_FRONTEND: noninteractive
            # `npm run dev &` + `npx wait-on` used to live here. It hung indefinitely on 2026-07-26
            # (the wait step takes ~22s when it works; it sat for over 20 minutes), and `wait-on` was
            # never a declared dependency, so npx fetched it from the network mid-run. The
            # `webServer` block in playwright.config.ts now owns startup, with its own readiness
            # probe and timeout — and it builds, so e2e runs against production output.
            # This also runs the visual baseline. `playwright test` with no `--project` runs every
            # project in the config, so the four of them — `e2e` plus the three `visual-*` axes —
            # share one `webServer`, and therefore one `next build`. Splitting the visual run into
            # its own job would pay for that build a second time.
            #
            # In comparison mode: `--update-snapshots` appears only in visual-baseline.yml. A gate
            # that refreshes its own baseline is a green light wired to nothing.
            #
            # This step ran `--project=e2e` for one merge (#235). The baseline it compares against
            # could not exist before `visual-baseline.yml` reached the default branch, because
            # `workflow_dispatch` refuses a workflow that is not on it.
            - name: Run end-to-end and visual tests
              run: npm run test:e2e:report
    version:
        name: Versioning
        if: github.event_name == 'push'
        runs-on: ubuntu-22.04
        timeout-minutes: 10
        needs: [code_checking, testing]
        # The only job that writes to this repository, so the only one that needs the scope.
        permissions:
            contents: write
        steps:
            - name: Checkout version repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  token: ${{ secrets.TOKEN_GITHUB }}
            - name: Version
              # Pinned to the v5.0.2 commit rather than the mutable tag: this step runs in a checkout
              # where TOKEN_GITHUB is persisted, so a retargeted tag would inherit that access.
              id: version
              uses: paulhatch/semantic-version@4d6da96a9bc3116da3613309a11ff75fba58eb8d
              with:
                  version_format: '${major}.${minor}.${patch}'
                  major_pattern: 'MAJOR -'
                  minor_pattern: 'MINOR -'
            - name: Update version in package.json and add tag
              # `[skip ci]` stops the version bump from re-triggering this workflow. It was harmless
              # while the trigger was `push: [dev]` and the bump landed elsewhere; now that the
              # trigger is `push: [master]` and the bump pushes to master, without it every release
              # would start another run, which would release again. The marker is honoured for
              # `push` and `pull_request` events.
              run: |
                  git config --global user.email "action@github.com"
                  git config --global user.name "GitHub Action"
                  npm version ${{ steps.version.outputs.version }} -m "chore(release): %s [skip ci]"
                  git push --follow-tags
