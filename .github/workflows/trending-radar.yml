# SDD-006: weekly trending content radar. Opens a GitHub issue with data-driven
# post briefs — it never publishes content by itself (AdSense scaled-content guardrail).
name: Trending content radar

on:
    schedule:
        - cron: '0 7 * * 1' # Mondays 07:00 UTC
    workflow_dispatch: {}

permissions:
    contents: read
    issues: write

jobs:
    radar:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Build report
              # ANALYTICS_* secrets are optional — without them the GSC rising-queries
              # section is skipped and the radar still works.
              env:
                  ANALYTICS_CLIENT_EMAIL: ${{ secrets.ANALYTICS_CLIENT_EMAIL }}
                  ANALYTICS_PRIVATE_KEY: ${{ secrets.ANALYTICS_PRIVATE_KEY }}
              # SDD-L11-T2. The install is no longer optional, so it no longer ends in `|| true`.
              # The radar validates its sources with zod now, making node_modules a hard
              # precondition where the old .js files had zero module-scope imports. A swallowed
              # install failure used to cost only the GSC section (googleapis is imported
              # dynamically); it would now surface two lines later as ERR_MODULE_NOT_FOUND against
              # a 0-byte report. Fail at the install, where the message names the cause.
              run: |
                  npm install --legacy-peer-deps --no-audit --no-fund --omit=dev --ignore-scripts googleapis > /dev/null 2>&1
                  node scripts/trending/index.ts > trending-report.md
                  tail -5 trending-report.md

            - name: Open issue
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TITLE="Trending radar $(date +%G-W%V)"
                  gh issue create --title "$TITLE" --body-file trending-report.md --label "content-radar" \
                    || gh issue create --title "$TITLE" --body-file trending-report.md
